version: v2
plugins:
  - remote: buf.build/community/stephenh-ts-proto:v2.12.1
    out: sdk/node/src/gen
    opt:
      - outputServices=nice-grpc
      - outputServices=generic-definitions
      - useExactTypes=false
      - esModuleInterop=true
      - importSuffix=.js
      - forceLong=bigint
      - oneof=unions-value
