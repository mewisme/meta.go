name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: ./scripts/proto.sh check
      - run: ./scripts/proto.sh check-future
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - shell: bash
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...

  node-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdk/node/pnpm-lock.yaml
      - run: pnpm --dir sdk/node install --frozen-lockfile
      - run: pnpm --dir sdk/node check
      - run: pnpm --dir sdk/node build
      - working-directory: sdk/node
        run: npm pack --dry-run

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
      - run: uv sync --directory sdk/python --frozen --all-groups
      - run: ./scripts/proto.sh check-python
      - run: uv run --directory sdk/python ruff check src/mewisme_meta tests scripts runtime/src
      - run: uv run --directory sdk/python ruff format --check src/mewisme_meta tests scripts runtime/src
      - run: uv run --directory sdk/python mypy src/mewisme_meta
      - run: uv run --directory sdk/python pytest
      - run: uv build --directory sdk/python

  runtime-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
      - run: pnpm --dir sdk/node install --frozen-lockfile
      - run: uv sync --directory sdk/python --frozen --all-groups
      - name: Resolve host runtime target
        id: target
        shell: bash
        run: |
          platform=$(node -p 'process.platform')
          arch=$(node -p 'process.arch')
          case "$arch" in
            x64) goarch=amd64 ;;
            arm64) goarch=arm64 ;;
            *) echo "unsupported runner architecture: $arch" >&2; exit 1 ;;
          esac
          case "$platform" in
            linux) goos=linux; python_target="linux-${arch}-manylinux"; ext="" ;;
            darwin) goos=darwin; python_target="darwin-${arch}"; ext="" ;;
            win32) goos=windows; python_target="win32-${arch}"; ext=".exe" ;;
            *) echo "unsupported runner platform: $platform" >&2; exit 1 ;;
          esac
          {
            echo "node_target=${platform}-${arch}"
            echo "python_target=$python_target"
            echo "goos=$goos"
            echo "goarch=$goarch"
            echo "ext=$ext"
          } >> "$GITHUB_OUTPUT"
      - name: Install UPX
        if: runner.os != 'macOS'
        uses: crazy-max/ghaction-upx@v4
        with:
          version: v5.2.1
          install-only: true
      - name: Build host runtime
        shell: bash
        run: |
          mkdir -p .cgm/runtime-lifecycle/node .cgm/runtime-lifecycle/python
          output="$GITHUB_WORKSPACE/.cgm/runtime-lifecycle/meta-runtime${{ steps.target.outputs.ext }}"
          CGO_ENABLED=0 GOOS=${{ steps.target.outputs.goos }} GOARCH=${{ steps.target.outputs.goarch }} go build -trimpath -o "$output" ./cmd/meta-runtime
          case "${{ steps.target.outputs.goos }}/${{ steps.target.outputs.goarch }}" in
            linux/amd64|linux/arm64|windows/amd64)
              upx --best "$output"
              upx -t "$output"
              ;;
          esac
          test -s "$output"
      - name: Pack Node SDK and bundled runtime
        shell: bash
        run: |
          version=0.0.0
          runtime="$GITHUB_WORKSPACE/.cgm/runtime-lifecycle/meta-runtime${{ steps.target.outputs.ext }}"
          node sdk/node/scripts/prepare-release.mjs "$version"
          node sdk/node/scripts/package-runtime.mjs --target "${{ steps.target.outputs.node_target }}" --version "$version" --binary "$runtime" --out-dir .cgm/runtime-lifecycle/node
          pnpm -C sdk/node pack --pack-destination ../../.cgm/runtime-lifecycle/node --silent
          python3 scripts/validate-release.py --version "$version" --node-dir sdk/node --node-sdk-archive "$(find .cgm/runtime-lifecycle/node -maxdepth 1 -type f -name 'meewmeew-meta-*.tgz' ! -name 'meewmeew-meta-runtime-*' -print -quit)"
      - name: Install and launch packed Node SDK
        shell: bash
        run: |
          install="$GITHUB_WORKSPACE/.cgm/runtime-lifecycle/node-install"
          mkdir -p "$install"
          printf '{"private":true,"type":"module"}\n' > "$install/package.json"
          root=$(find "$GITHUB_WORKSPACE/.cgm/runtime-lifecycle/node" -maxdepth 1 -type f -name 'meewmeew-meta-*.tgz' ! -name 'meewmeew-meta-runtime-*' -print -quit)
          runtime=$(find "$GITHUB_WORKSPACE/.cgm/runtime-lifecycle/node" -maxdepth 1 -type f -name 'meewmeew-meta-runtime-*.tgz' -print -quit)
          pnpm --dir "$install" add --ignore-scripts --config.optional=false "$runtime" "$root"
          cd "$install"
          node --input-type=module -e 'import {MetaClient} from "@meewmeew/meta"; const client = await MetaClient.create({mode:"managed", env:{META_RUNTIME_PATH:"", PATH:""}}); if (client.info()?.protocol?.major !== 1) throw new Error("runtime protocol mismatch"); await client.close()'
      - name: Pack Python SDK and bundled runtime
        shell: bash
        run: |
          version=0.0.0
          runtime="$GITHUB_WORKSPACE/.cgm/runtime-lifecycle/meta-runtime${{ steps.target.outputs.ext }}"
          python3 sdk/python/scripts/prepare-release.py "$version"
          python3 sdk/python/scripts/package-runtime.py --target "${{ steps.target.outputs.python_target }}" --version "$version" --binary "$runtime" --out-dir .cgm/runtime-lifecycle/python
          uv build --directory sdk/python --wheel --out-dir "$GITHUB_WORKSPACE/.cgm/runtime-lifecycle/python"
          python3 scripts/validate-release.py --version "$version" --python-dir sdk/python --python-sdk-wheel "$(find .cgm/runtime-lifecycle/python -maxdepth 1 -type f -name 'mewisme_meta-*.whl' ! -name 'mewisme_meta_runtime-*' -print -quit)"
      - name: Install and launch packed Python SDK
        shell: bash
        run: |
          venv="$GITHUB_WORKSPACE/.cgm/runtime-lifecycle/python-venv"
          uv venv "$venv"
          python="$venv/bin/python"
          if [ "${{ runner.os }}" = "Windows" ]; then python="$venv/Scripts/python.exe"; fi
          runtime=$(find "$GITHUB_WORKSPACE/.cgm/runtime-lifecycle/python" -maxdepth 1 -type f -name 'mewisme_meta_runtime-*.whl' -print -quit)
          root=$(find "$GITHUB_WORKSPACE/.cgm/runtime-lifecycle/python" -maxdepth 1 -type f -name 'mewisme_meta-*.whl' ! -name 'mewisme_meta_runtime-*' -print -quit)
          uv pip install --python "$python" "$runtime" "$root"
          "$python" - <<'PY'
          import asyncio
          from mewisme_meta import MetaClient

          async def main() -> None:
              client = await MetaClient.managed(env={"META_RUNTIME_PATH": "", "PATH": ""})
              assert client.info is not None and client.info.protocol.major == 1
              await client.close()

          asyncio.run(main())
          PY

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.1
          args: check
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@latest
