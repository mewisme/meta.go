name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: ./scripts/proto.sh check
      - run: ./scripts/proto.sh check-future
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - shell: bash
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...

  node-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdk/node/pnpm-lock.yaml
      - run: pnpm --dir sdk/node install --frozen-lockfile
      - run: pnpm --dir sdk/node check
      - run: pnpm --dir sdk/node build
      - working-directory: sdk/node
        run: npm pack --dry-run

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
      - run: uv sync --directory sdk/python --frozen --all-groups
      - run: ./scripts/proto.sh check-python
      - run: uv run --directory sdk/python ruff check src/mewisme_meta tests scripts runtime/src
      - run: uv run --directory sdk/python ruff format --check src/mewisme_meta tests scripts runtime/src
      - run: uv run --directory sdk/python mypy src/mewisme_meta
      - run: uv run --directory sdk/python pytest
      - run: uv build --directory sdk/python

  runtime-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
      - run: pnpm --dir sdk/node install --frozen-lockfile
      - run: uv sync --directory sdk/python --frozen --all-groups
      - run: pnpm --dir sdk/node exec tsx --test test/runtime.test.ts test/distribution.test.ts
      - run: uv run --directory sdk/python pytest -q tests/test_runtime.py tests/test_distribution.py

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.1
          args: check
