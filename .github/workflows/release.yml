name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWORK: off

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0.24.0
      - name: Add Syft to PATH
        shell: bash
        run: dirname '${{ steps.syft.outputs.cmd }}' >> "$GITHUB_PATH"
      - name: Verify source
        run: |
          go mod verify
          test -z "$(gofmt -l .)"
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
          go test ./...
          go test -race ./...
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/**/meta-runtime*
            dist/*checksums.txt
            dist/*.sbom.json
