name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWORK: off

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: Resolve release version
        run: echo "version=$(bash scripts/release-version.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
      - name: Verify source
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          go mod verify
          test -z "$(gofmt -l .)"
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
          go test ./...
          go test -race ./...
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          pnpm -C sdk/node install --frozen-lockfile
          pnpm -C sdk/node check
          uv sync --directory sdk/python --frozen --all-groups
          uv run --directory sdk/python ruff check src/mewisme_meta tests scripts runtime/src
          uv run --directory sdk/python ruff format --check src/mewisme_meta tests scripts runtime/src
          uv run --directory sdk/python mypy src/mewisme_meta
          uv run --directory sdk/python pytest

  build-runtime:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            goos: linux
            goarch: amd64
            ext: ""
          - id: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - id: darwin-x64
            goos: darwin
            goarch: amd64
            ext: ""
          - id: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - id: win32-x64
            goos: windows
            goarch: amd64
            ext: .exe
          - id: win32-arm64
            goos: windows
            goarch: arm64
            ext: .exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build runtime
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p runtime
          output="runtime/meta-runtime_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags "-s -w -X go.mewis.me/meta.go.Version=${VERSION} -X go.mewis.me/meta.go.Commit=${GITHUB_SHA}" -o "$output" ./cmd/meta-runtime
          test -s "$output"
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.id }}
          path: runtime/*
          if-no-files-found: error

  package-node-runtime:
    needs: [validate, build-runtime]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64, win32-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: runtime-${{ matrix.target }}
          path: runtime
      - name: Package Node runtime
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          binary=$(find runtime -type f -name 'meta-runtime*' -print -quit)
          node sdk/node/scripts/package-runtime.mjs --target "${{ matrix.target }}" --version "$VERSION" --binary "$binary" --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: node-runtime-${{ matrix.target }}
          path: dist/*.tgz
          if-no-files-found: error

  package-python-runtime:
    needs: [validate, build-runtime]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-manylinux
            runtime: linux-x64
          - target: linux-x64-musllinux
            runtime: linux-x64
          - target: linux-arm64-manylinux
            runtime: linux-arm64
          - target: linux-arm64-musllinux
            runtime: linux-arm64
          - target: darwin-x64
            runtime: darwin-x64
          - target: darwin-arm64
            runtime: darwin-arm64
          - target: win32-x64
            runtime: win32-x64
          - target: win32-arm64
            runtime: win32-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: runtime-${{ matrix.runtime }}
          path: runtime
      - name: Package Python runtime
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          binary=$(find runtime -type f -name 'meta-runtime*' -print -quit)
          python3 sdk/python/scripts/package-runtime.py --target "${{ matrix.target }}" --version "$VERSION" --binary "$binary" --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-runtime-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  package-node-sdk:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Package Node SDK
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm -C sdk/node install --frozen-lockfile
          node sdk/node/scripts/prepare-release.mjs "$VERSION"
          python3 scripts/validate-release.py --version "$VERSION" --node-dir sdk/node
          mkdir -p dist
          pnpm -C sdk/node pack --pack-destination ../../dist --silent
          python3 scripts/validate-release.py --version "$VERSION" --node-sdk-archive "$(find dist -name '*.tgz' -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: node-sdk
          path: dist/*.tgz
          if-no-files-found: error

  package-python-sdk:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
      - name: Package Python SDK
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          uv sync --directory sdk/python --frozen --all-groups
          python3 sdk/python/scripts/prepare-release.py "$VERSION"
          python3 scripts/validate-release.py --version "$VERSION" --python-dir sdk/python
          uv build --directory sdk/python --out-dir "$GITHUB_WORKSPACE/dist"
          python3 scripts/validate-release.py --version "$VERSION" --python-sdk-wheel "$(find dist -name '*.whl' -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdk
          path: dist/*
          if-no-files-found: error

  validate-node-runtime-artifacts:
    needs: [validate, package-node-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: node-runtime-*
          path: dist
          merge-multiple: true
      - env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python3 scripts/validate-release.py --version "$VERSION" --node-runtime-dir dist

  validate-python-runtime-artifacts:
    needs: [validate, package-python-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: python-runtime-*
          path: dist
          merge-multiple: true
      - env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python3 scripts/validate-release.py --version "$VERSION" --python-runtime-dir dist

  publish-node-runtime:
    needs: [validate, validate-node-runtime-artifacts]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: node-runtime-*
          path: dist
          merge-multiple: true
      - run: for package in dist/*.tgz; do npm publish "$package" --access public --provenance; done

  publish-python-runtime:
    needs: validate-python-runtime-artifacts
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-runtime-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-node-sdk:
    needs: [publish-node-runtime, package-node-sdk]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: node-sdk
          path: dist
      - run: npm publish "$(find dist -name '*.tgz' -print -quit)" --access public --provenance

  publish-python-sdk:
    needs: [publish-python-runtime, package-python-sdk]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-sdk
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  release-go:
    needs: [validate, build-runtime, publish-node-sdk, publish-python-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-*
          path: runtime-dist
          merge-multiple: true
      - name: Runtime checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd runtime-dist
          sha256sum meta-runtime_* > "meta-runtime_${VERSION}_checksums.txt"
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0.24.2
      - name: Add Syft to PATH
        run: dirname '${{ steps.syft.outputs.cmd }}' >> "$GITHUB_PATH"
      - name: Release Go CLI
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload standalone runtime assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" runtime-dist/* --clobber
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*checksums.txt
            dist/*.sbom.json
            runtime-dist/*
